# Overrides on top of detekt's bundled defaults (buildUponDefaultConfig = true
# in the root build file). Deliberately near-empty at scaffold time — rule
# tweaks land here as real code arrives, with a comment saying why.

naming:
  # Composables are PascalCase by Compose convention.
  FunctionNaming:
    ignoreAnnotated: ["Composable"]

complexity:
  # A settings ViewModel is one handler per setting by construction, and the
  # alternative — one onChange(field, value) — would hide which writes can
  # refuse. Raised by one when the reminder switch arrived rather than merging
  # two handlers that refuse differently.
  TooManyFunctions:
    thresholdInClasses: 12

style:
  # Match ktlint's max_line_length in .editorconfig — one limit, two tools.
  MaxLineLength:
    maxLineLength: 140
  # @Preview composables exist for the IDE, not for callers.
  UnusedPrivateMember:
    ignoreAnnotated: ["Preview"]
