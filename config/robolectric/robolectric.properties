# The Robolectric SDK level, for every module in the project.
#
# Robolectric defaults its SDK to the merged manifest's targetSdk, which this
# project pins to 37. That default fails a module's whole Robolectric test class
# at startup, not on an assertion, for two separate reasons:
#
#   - Robolectric 4.16.1 ships android-all jars only up to Android 16 (API 36),
#     so there is nothing to resolve for 37 at all.
#   - API 36 additionally requires Java 21, and architecture §7 pins this
#     project to JDK 17. API 35 is the newest that runs on 17.
#
# So 35 is a JDK ceiling, not a Robolectric one: raising it means moving the
# whole project to Java 21, not just bumping the robolectric version. minSdk is
# 29, so 35 is well inside the supported range either way.
#
# One file rather than one per module. It lived in :core:data and was copied
# into :feature:today, at which point the copy already carried a comment telling
# the reader to go and read the original. configureAndroid in build-logic puts
# this directory on every android module's unit-test resources, so a module that
# adds Robolectric inherits the ceiling instead of rediscovering it.
sdk=35
