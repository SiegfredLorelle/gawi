version: 2

updates:
  # Enabled by default — every repo from this template uses GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # Must satisfy .commitlintrc.yaml: type + kebab-case scope <= 12 chars,
      # and the whole header within 50 characters.
      prefix: "build(deps)"
    groups:
      actions:
        update-types: [minor, patch]

  # Reads gradle/libs.versions.toml, so this one entry covers the main build
  # and build-logic.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-patch:
        update-types: [minor, patch]
