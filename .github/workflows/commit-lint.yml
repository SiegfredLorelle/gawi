name: commitlint

# The enforcement layer. The local commit-msg hook is fast feedback, but
# `git commit --no-verify` skips it — this cannot be skipped once the check
# is marked required in branch protection.
#
# Reads the same .commitlintrc.yaml as the local hook, so the rules can never
# drift between your machine and CI.

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    # Dependabot generates its own messages and cannot be configured to
    # respect the length rules. `commit-message.prefix` in dependabot.yml
    # fixes the header, but the BODY always embeds changelog links like
    #   Bumps [actions/checkout](https://github.com/actions/checkout) from ...
    # at 73-74 characters, which breaks body-max-line-length: 72. A URL
    # cannot be wrapped, so this fails on every bot PR, not just occasional
    # ones — verified against PR #1 in this repo.
    #
    # A job skipped via a job-level `if:` reports as successful to branch
    # protection, so this stays safe to mark as a required check.
    #
    # This cannot be expressed in .commitlintrc.yaml: commitlint's `ignores`
    # option takes JavaScript functions, and a YAML config cannot hold one.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needs every commit in the PR, not just the tip

      - uses: wagoid/commitlint-github-action@v6.2.1
        with:
          configFile: .commitlintrc.yaml
          # commitlint's defaultIgnores stays on, so "Merge ..." and
          # "Revert ..." commits generated by the GitHub UI do not fail here.
