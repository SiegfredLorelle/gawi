name: ci

# Stack-blind on purpose. This file should be identical in every repo made
# from this template — it only ever calls `make`, so it works for Python,
# React, PHP or Go without changes. Wire the Makefile, not this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history

      # TEMPLATE.md is deleted at the end of setup, so its absence means
      # "setup is done". If setup claims to be done but the Makefile still
      # has stub bodies, then lint and test are passing on nothing — which
      # looks identical to a green build. Fail loudly instead.
      - name: template setup completed
        run: |
          if [ ! -f TEMPLATE.md ] && grep -q "not wired" Makefile; then
            echo "::error::TEMPLATE.md is gone but Makefile targets are still stubs."
            echo "::error::Wire fmt/lint/test from docs/stacks/ before merging."
            exit 1
          fi

      # Backstop for the local pre-commit hook, which --no-verify bypasses.
      # Runs the binary directly rather than gitleaks-action@v2, which
      # requires a paid licence for organization-owned repositories.
      # Version is pinned manually — Dependabot cannot see a URL in a run step.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact --no-banner --exit-code 1

      # Stack deviation, documented in docs/stacks/kotlin-android.md: Gradle
      # needs a pinned JDK, and without dependency caching every run pays a
      # cold multi-minute build. The Android SDK itself needs no step —
      # ubuntu-latest ships it with licenses accepted.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          # GitHub cache storage is not encrypted, so the action only saves
          # Gradle's configuration cache when given a key to encrypt it with.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: setup
        run: make setup

      - name: lint
        run: make lint

      - name: test
        run: make test
