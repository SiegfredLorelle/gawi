# Local git hooks for every language. Install with `make setup`.
#
# These hooks are fast feedback, not enforcement — `git commit --no-verify`
# bypasses all of them. The real gates are in .github/workflows/, which re-runs
# commitlint and gitleaks on every pull request.
#
# NOTE: the commitlint hook is `language: node`, so the first run downloads an
# isolated Node toolchain into ~/.cache/pre-commit even in a pure Python, PHP
# or Go repo. Your repo tree stays free of node_modules, but expect a one-time
# pause on the first commit on a new machine.

# Without this, `pre-commit install` wires only the pre-commit hook and
# commitlint never runs. This is the single most common setup bug.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        # gradlew.bat is deliberately CRLF (see .gitattributes).
        exclude: '\.(bat|cmd)$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Pinned to the major CI runs, which is the whole point of the hook.
        # wagoid/commitlint-github-action@v6.2.1 bundles the 19 line, and it is
        # the newest tag that action has published, so 19 is a ceiling and not a
        # preference. Left unpinned this hook installs its own newest (21), and
        # the two parsers disagree about what a body line is -- a clean local
        # commit was then not proof CI would pass, which is the one thing a
        # commit-msg hook exists to tell you. Ranges rather than exact patches
        # on purpose: these are the constraints the action itself declares.
        # Move these and .github/workflows/commit-lint.yml together.
        #
        # Known soft spot: this pin wins by npm resolution, not by declaration.
        # The hook package declares its own @commitlint/cli 21 and its own
        # commitlint bin, so two installed packages claim the name; npm hoists
        # the root request here and bin/commitlint resolves to 19, with 21 left
        # nested alongside. Verified, but a different npm or install order could
        # resolve it the other way silently. The structural fix, if it ever
        # matters, is pinning rev: to a hook release whose own dependency is the
        # 19 line. Check with: commitlint --version, inside the hook env.
        additional_dependencies:
          - "@commitlint/cli@^19.2.1"
          - "@commitlint/config-conventional@^19.1.0"
# Stack linters would go here. This repo deliberately has none: Spotless and
# detekt need a warm Gradle daemon, which is too slow for a pre-commit hook, so
# `make lint` owns them and CI is the backstop. See docs/stacks/kotlin-android.md.
