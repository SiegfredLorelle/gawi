[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
# lifecycle-runtime-compose only, for collectAsStateWithLifecycle. Its sibling
# lifecycle-viewmodel-compose used to be declared here for viewModel(); every
# screen resolves its ViewModel through hiltViewModel() now, so it arrives as a
# transitive of androidx.hilt and nothing calls it directly.
lifecycle = "2.11.0"
hilt = "2.60.1"
# Navigation arrives with the second screen (docs/architecture.md §2).
# 2.10.0 is still rc at the time of writing; every other version here is
# stable, so this one is too.
navigation = "2.9.8"
androidxHilt = "1.4.0"
androidxTestExtJunit = "1.3.0"
kotlinxSerializationJson = "1.11.0"
room = "2.8.4"
datastore = "1.2.1"
coroutines = "1.10.2"
detekt = "1.23.8"
spotless = "8.9.0"
# Consumed by the Spotless config in the root build file, not a plugin.
ktlint = "1.8.0"
junit = "4.13.2"
# :core:data pins the test SDK to 35 in robolectric.properties rather than
# taking the targetSdk default, which would be 37. Read that file before
# bumping this: the ceiling is the project's JDK 17, not this version.
robolectric = "4.16.1"
turbine = "1.2.0"
# SDK levels and JDK, read by the convention plugins in build-logic.
# ci.yml's setup-java pins the same JDK by hand — keep them in step.
minSdk = "29"
compileSdk = "37"
targetSdk = "37"
jdk = "17"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Not covered by the compose BOM — androidx.activity ships on its own train,
# so activityCompose above is the number that moves.
#
# Two modules now. :app for setContent and enableEdgeToEdge; :feature:settings
# for rememberLauncherForActivityResult, which is the only way a composable
# reaches the Storage Access Framework. Its pom is activity, compose and
# lifecycle, so nothing a feature module has no business with arrives with it —
# the same test hilt-lifecycle-viewmodel-compose passed and
# hilt-navigation-compose failed.
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Versionless, so the compose BOM decides. material3 pulls both in today;
# :core:ui declares them because Modifier and isSystemInDarkTheme are used
# there directly rather than incidentally.
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# Compose UI tests, run on the JVM under Robolectric rather than on a device —
# architecture §8 keeps CI on unit tests only, and these fit that gate as they
# are. Versionless like the entries above, so the BOM decides: the platform is
# declared on implementation and its constraints apply across the whole
# resolution, so a testImplementation entry is governed by it too.
#
# ui-test-manifest carries no code. It contributes the AndroidManifest that
# declares the ComponentActivity createComposeRule() launches — and that
# activity is android:exported="true". Put it on testImplementation, never on
# debugImplementation: a variant configuration merges it into :app's packaged
# debug manifest too, which adds an exported activity to every debug install,
# reachable by any app that knows its name. The unit test manifest merge reads
# test-configuration dependencies, so nothing is lost by scoping it. Android
# Lint will not catch the mistake — ExportedActivity is off by default and the
# lint report stayed clean while the manifest carried it.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# Both arrive with the first NavHost, which is the second screen.
#
# navigation-compose's type-safe routes are @Serializable classes, so :app
# applies the kotlin-serialization plugin the way :core:domain already does.
#
# hiltViewModel() was deliberately absent while there was one screen, because
# viewModel() resolves the same Hilt factory through the @AndroidEntryPoint
# activity. With a back stack that stops being true: the store owner becomes the
# destination rather than the activity, which is the one case where the two
# differ, and it is the difference that stops a ViewModel outliving the screen
# that owns it. It also carries hiltViewModel(creationCallback), which is how
# the habit editor is handed the habit it is editing.
#
# hilt-lifecycle-viewmodel-compose, not hilt-navigation-compose. As of 1.4.0 the
# navigation artifact only re-exports these as deprecated aliases, and its pom
# drags navigation in — which a feature module has no business having on its
# classpath, since :app owns the graph. This one's pom is compose, lifecycle and
# hilt and nothing else, so the claim that no feature module knows what a
# NavController is stays true rather than aspirational.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# Only :app has these. A journey test drives the real graph through the real
# MainActivity, because every feature screen and ViewModel is internal to its
# module and hiltViewModel() needs an @AndroidEntryPoint host.
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
# Declared rather than left transitive. createAndroidComposeRule's return type
# names ActivityScenarioRule, which lives here and only arrives through
# ui-test-junit4 by accident — the same trap ApplicationProvider was.
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# build-logic classpath only
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }
compose-compiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
