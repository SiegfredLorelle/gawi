# CodeRabbit config. Only takes effect if the CodeRabbit app is installed on
# the repo — free on public repositories, paid on private ones.
#
# If you are using the Claude review workflow instead, you can leave this file
# in place; it does nothing until the app is enabled.

language: en

reviews:
  profile: chill # `assertive` is noticeably noisier on small PRs
  request_changes_workflow: false
  high_level_summary: true
  review_status: false
  poem: false

  auto_review:
    enabled: true
    drafts: false

  # The description check earns its keep — it caught a PR left on the
  # template. Advisory only; `request_changes_workflow: false` above means
  # nothing here blocks a merge.
  #
  # Docstring coverage is off rather than retuned. The metric counts every
  # declaration in the diff, so a Kotlin repo is scored partly on its
  # backticked test function names (`rejects uppercase hex` and friends).
  # :core:domain landed with KDoc on roughly a third of its main declarations
  # and on every non-obvious decision, and still scored 3.24% against the 80%
  # default. Any threshold this repo could actually hold sits so low it would
  # never fail a real PR, so it would be a check in name only — and one that
  # can never go green just trains you to ignore checks.
  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      mode: "off"

  path_filters:
    - "!**/*.lock"
    - "!**/uv.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/composer.lock"
    - "!**/go.sum"
    - "!dist/**"
    - "!build/**"
    - "!coverage/**"

  path_instructions:
    - path: "**/*"
      instructions: >-
        Follow the conventions documented in AGENTS.md. Do not flag formatting
        that the project's linter already handles.

chat:
  auto_reply: true
