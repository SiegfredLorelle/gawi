# Robolectric defaults to the merged manifest's targetSdk, which this project
# pins to 37. Robolectric 4.16.1 ships android-all jars up to Android 16
# (API 36) only, so the default resolves to a jar that does not exist and every
# test in this module dies at startup rather than failing an assertion.
#
# Raise this when a Robolectric release adds the matching jar, and keep it in
# step with `robolectric` in gradle/libs.versions.toml.
sdk=36
